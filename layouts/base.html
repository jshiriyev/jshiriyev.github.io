<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="utf-8" />

    <meta name="viewport" content = "width=device-width, initial-scale=1.0">
    <meta name="keywords" content = "reservoir engineering, reservoir simulation, field development, petrophysics, formation evaluation, python tools, scientific computing, teaching materials">
    <meta name="description" content = "{{ page.get('description', 'Reservoir engineering portfolio, Python tools, project examples, and teaching materials.') }}">

    <title>{{ page['title'] }} | Shiriyev Portfolio</title>

    <link rel="stylesheet" href="{{ page['asset_prefix'] }}/styles/main.css">
    <link rel="stylesheet" href="{{ page['asset_prefix'] }}/styles/hybrid.css">

  </head>

  <body>

    <script src="{{ page['asset_prefix'] }}/scripts/header.js"></script>
    <script src="{{ page['asset_prefix'] }}/scripts/footer.js"></script>

    <div id="page-container">

      <page-header></page-header>

      <nav class="ribbon">
        {{ page['html-ribbon'] }}
      </nav>

      <main>

        {% if page['nick']=="pydemo" %}
        <nav class="sidebar pydemo">
        {% else %}
        <nav class="sidebar library">
        {% endif %}
          {{ page['html-sidebar'] }}
        </nav>
        
        {% if 'html-hybrid' in page %}
        <div class="hybrid">
          {{ page['html-hybrid'] }}
        </div>
        {% endif %}

        <div class="canvas">
          {{ page['html-canvas'] }}
        </div>

      </main>

      <page-footer></page-footer>
      
    </div>

    <script src="{{ page['asset_prefix'] }}/scripts/main.js"></script>
    <script src="{{ page['asset_prefix'] }}/scripts/ribbon.js"></script>
    <script src="{{ page['asset_prefix'] }}/scripts/sidebar.js"></script>
    <script src="{{ page['asset_prefix'] }}/scripts/hybrid.js"></script>
    <script src="{{ page['asset_prefix'] }}/scripts/canvas.js"></script>

  </body>

</html>
